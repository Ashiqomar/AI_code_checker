name: Gemini AI Code Reviewer

on:
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  review:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      issues: write

    steps:
      - name: Checkout Repository Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install google-genai requests pydantic PyGithub

      - name: Fetch PR Diff & Execute Gemini AI Review
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          REPO_NAME: ${{ github.repository }}
        run: |
          python - << 'EOF'
          import os
          import requests
          from google import genai
          from google.genai import types
          from github import Github

          api_key = os.getenv("GEMINI_API_KEY")
          gh_token = os.getenv("GITHUB_TOKEN")
          pr_num = int(os.getenv("PR_NUMBER"))
          repo_name = os.getenv("REPO_NAME")

          if not api_key:
              print("❌ GEMINI_API_KEY secret missing in repository settings.")
              exit(1)

          g = Github(gh_token)
          repo = g.get_repo(repo_name)
          pr = repo.get_pull(pr_num)

          # Fetch diff
          diff_url = pr.diff_url
          headers = {"Authorization": f"token {gh_token}"}
          res = requests.get(diff_url, headers=headers)
          diff_text = res.text if res.status_code == 200 else "Unable to fetch PR diff."

          # System Instructions
          system_instructions = """
          You are a Senior Staff Software Engineer and AppSec Architect conducting a rigorous PR code review.
          Analyze the git diff for:
          1. Security vulnerabilities (OWASP, injection, credential leak)
          2. Logic bugs and edge cases
          3. Performance degradation or N+1 queries
          4. Code maintainability and best practices

          Output a structured Markdown review starting with:
          ### 🤖 Gemini AI Code Reviewer
          **Overall Score:** X / 100
          **Risk Level:** [CRITICAL | HIGH | MEDIUM | LOW | PASSED]

          Provide actionable feedback with code snippets showing BEFORE (❌) and AFTER (✅) fixes.
          """

          # Initialize Gemini Client
          client = genai.Client(api_key=api_key)
          
          prompt = f"""
          Review the following Pull Request diff for PR #{pr_num}: '{pr.title}'
          
          ```git
          {diff_text[:120000]}
          ```
          """

          response = client.models.generate_content(
              model="gemini-3.6-flash",
              contents=prompt,
              config=types.GenerateContentConfig(
                  system_instruction=system_instructions,
                  temperature=0.2
              )
          )

          review_body = response.text

          # Post comment to PR
          pr.create_issue_comment(review_body)
          print(f"✅ Successfully posted Gemini AI Code Review comment to PR #{pr_num}")
          EOF

      - name: Post Fallback Summary via GitHub Script if needed
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: "⚠️ **Gemini AI Code Reviewer Bot encountered an error.** Please ensure `GEMINI_API_KEY` is configured in your GitHub repository secrets."
            })
